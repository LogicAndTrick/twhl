name: twhl-dev
services:
  composer:
    container_name: twhl-dev-composer
    command: composer install
    environment:
      - COMPOSER_IGNORE_PLATFORM_REQS=1
    image: composer:latest
    volumes:
       - ../:/var/twhl:z
    working_dir: /var/twhl
  db:
    command:
      --collation-server=utf8mb4_unicode_ci
    container_name: twhl-dev-mysql
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=twhl
      - MYSQL_ROOT_PASSWORD=cs_canbunk2
    healthcheck:
      test: "/usr/bin/mysql --user=root --password=cs_canbunk2 --execute \"SELECT 1;\""
      interval: 5s
      timeout: 5s
      retries: 10
    image: mysql:8.4
    ports:
      - "3340:3306"
    volumes:
      - twhl-dev-mysql-data:/var/lib/mysql
  migration-runner:
    build:
      context: ./migration-runner
    container_name: twhl-dev-migration-runner
    depends_on:
      composer:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    env_file:
      - path: ../.env.example
      - path: ../.env
        required: false
    environment:
      - APP_KEY=base64:PB2xpacpFD+vjAcrcj/tBEQ7RzAtvUyufGd4KznJ81k=
      - DB_DATABASE=twhl
      - DB_HOST=db
      - DB_PASSWORD=cs_canbunk2
      - DB_USERNAME=root
    image: twhl-dev/migration-runner
    volumes:
       - ../:/var/twhl:z
  node:
    container_name: twhl-dev-node
    command: npm install
    image: node:lts
    secrets:
       - source: npmrc
         target: /root/.npmrc
    # Lets the container read `~/.npmrc` on SELinux hosts such as Fedora, where
    # the `user_home_t` label would otherwise block access
    security_opt:
       - label=disable
    volumes:
       - ../:/var/twhl:z
    working_dir: /var/twhl
  php-apache:
    build:
      context: ./php-apache
    container_name: twhl-dev-php-apache
    depends_on:
      composer:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
      node:
        condition: service_completed_successfully
    env_file:
      - path: ../.env.example
      - path: ../.env
        required: false
    environment:
      - APP_KEY=base64:PB2xpacpFD+vjAcrcj/tBEQ7RzAtvUyufGd4KznJ81k=
      - APP_URL=http://localhost:1082
      - DB_DATABASE=twhl
      - DB_HOST=db
      - DB_PASSWORD=cs_canbunk2
      - DB_USERNAME=root
    image: twhl-dev/php-apache
    ports:
      - "1082:1082"
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../:/var/www/html/twhl:z
      - ./php-apache/twhl-dev-php-conf.d:/usr/local/etc/php/conf.d:z
secrets:
  npmrc:
    file: ~/.npmrc
volumes:
  twhl-dev-mysql-data:
